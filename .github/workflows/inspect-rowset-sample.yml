name: Inspeccionar muestra cruda del rowset de una DE

on:
  workflow_dispatch:
    inputs:
      de_name:
        description: 'Nombre exacto de la DE (debe existir en de_progress ya cacheado)'
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Restaurar progreso de corridas anteriores (contacts.db)
        uses: actions/cache/restore@v4
        with:
          path: |
            contacts.db
            contacts.db-wal
            contacts.db-shm
          key: contacts-db-${{ github.run_id }}
          restore-keys: |
            contacts-db-

      - name: Inspeccionar muestra cruda
        run: node inspect-rowset-sample.js
        env:
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SFMC_SUBDOMAIN: ${{ secrets.SFMC_SUBDOMAIN }}
          INSPECT_DE_NAME: ${{ github.event.inputs.de_name }}
