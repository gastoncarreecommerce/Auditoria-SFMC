name: Diagnosticar contact_map de una DE puntual

on:
  workflow_dispatch:
    inputs:
      de_name:
        description: 'Nombre exacto de la DE a diagnosticar (tal cual aparece en el log de extract-contacts.js)'
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Restaurar progreso de corridas anteriores (contacts.db)
        uses: actions/cache/restore@v4
        with:
          path: |
            contacts.db
            contacts.db-wal
            contacts.db-shm
          key: contacts-db-${{ github.run_id }}
          restore-keys: |
            contacts-db-

      - name: Diagnosticar
        run: node diagnose-de.js
        env:
          DIAGNOSE_DE_NAME: ${{ github.event.inputs.de_name }}
